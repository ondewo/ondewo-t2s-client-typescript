name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface
      # only -- auth/ (the D18 Keycloak offline-token provider) and examples/. `pretest` compiles both
      # via tsconfig.test.json, whose `include` is a GLOB, and c8 runs with `--all`, so a new
      # hand-written source that nobody tests drops the gate below 100% instead of being skipped.
      - name: Unit tests + 100% coverage gate on hand-written code
        run: npm test

      # `make build` regenerates package.json from the proto-compiler image and `restore_ci_test_setup`
      # merges the test scripts + devDeps back from .ci-package.json. If the two drift apart, the
      # restore silently reinstates a stale gate, so CI asserts they still agree.
      - name: package.json <-> .ci-package.json mirror
        run: npm run test:drift
